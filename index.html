<title>Air Brake Trainer</title>
<style>
  /* Layout: a slim bar with the two views, then the chosen view filling the rest of the screen.
     The trainer's own dark look (site.css), kept so the browser version matches the installed one. */
  :root {
    --bg: #141414; --panel: #1b1b1b; --line: #2c2c2c; --text: #dcdcdc; --dim: #8a8a8a;
    --accent: #4fc3f7; --tab-on: #1d4f6b; --warn: #ffc04d;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
  .bar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { color: var(--text); text-decoration: none; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px; }
  .tabs a[aria-current="page"] { background: var(--tab-on); border-color: #2a6d93; color: #fff; }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .where { margin-left: auto; color: var(--dim); font-size: 12px; }
  .stage { flex: 1; position: relative; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; padding: 24px; }
  .loading b { font-size: 16px; font-weight: 600; }
  .loading span { color: var(--dim); font-size: 13px; max-width: 46ch; line-height: 1.5; }
  .gauge { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gauge { animation: none; border-color: var(--accent); } }
  .notice { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 560px; display: flex; gap: 12px; align-items: flex-start;
    background: #2a2414; border: 1px solid #6b5520; color: var(--text); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.45; z-index: 5; }
  .notice[hidden] { display: none; }
  .notice p { margin: 0; flex: 1; white-space: pre-line; }
  .notice button { background: transparent; color: var(--warn); border: 1px solid #6b5520; border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
</style>

<div class="bar">
  <h1>Air Brake Trainer</h1>
  <nav class="tabs" aria-label="Views">
    <a href="#air-brake" data-view="air-brake">Brake Pipe Propagation Simulator</a>
    <a href="#locomotive" data-view="locomotive">Locomotive and Car Air Rack</a>
  </nav>
  <span class="where">Runs on this device. Nothing is saved.</span>
</div>

<div class="stage">
  <div class="loading" id="loading">
    <div class="gauge" aria-hidden="true"></div>
    <b id="loadTitle">Charging the air brake engine</b>
    <span id="loadText">About 10 MB the first time. The simulator runs entirely in this browser: no sign-in, and test results aren't kept.</span>
  </div>
  <iframe id="air-brake" title="Brake Pipe Propagation Simulator" hidden></iframe>
  <iframe id="locomotive" title="Locomotive and Car Air Rack" hidden></iframe>
</div>

<div class="notice" id="notice" hidden><p id="noticeText"></p><button id="noticeClose">OK</button></div>

<script type="module">
const views = { "air-brake": "airbrake.html", "locomotive": "locomotive.html" };
const frames = Object.keys(views).map(id => document.getElementById(id));
let latest = null;

// Messages the pages would have shown in a pop-up.
window.notify = text => {
  document.getElementById("noticeText").textContent = text;
  document.getElementById("notice").hidden = false;
  clearTimeout(window.notify.timer);
  window.notify.timer = setTimeout(() => { document.getElementById("notice").hidden = true; }, 20000);
};
document.getElementById("noticeClose").onclick = () => { document.getElementById("notice").hidden = true; };

// The engine: on a background thread where the browser allows it, otherwise on this page.
function workerEngine() {
  return new Promise((resolve, reject) => {
    const worker = new Worker("engine-worker.js", { type: "module" });
    const waiting = new Map();
    let next = 1;
    worker.onerror = e => reject(new Error(e.message || "The engine couldn't start in the background."));
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") resolve({ call: (method, path, body) => new Promise(r => { const id = next++; waiting.set(id, r); worker.postMessage({ id, method, path, body }); }) });
      else if (m.type === "live") relay(JSON.parse(m.live));
      else if (m.type === "reply") { waiting.get(m.id)?.(m.reply); waiting.delete(m.id); }
    };
  });
}

async function pageEngine() {
  const { dotnet } = await import("./framework/dotnet.js");
  const { getAssemblyExports, getConfig } = await dotnet.create();
  const api = (await getAssemblyExports(getConfig().mainAssemblyName)).BrowserApi;
  let last = performance.now();
  setInterval(() => { const now = performance.now(); api.Tick((now - last) / 1000); last = now; relay(JSON.parse(api.Live())); }, 100);
  return { call: async (method, path, body) => api.Call(method, path, body || "") };
}

// Live updates go to the view on screen; the other one catches up when it's shown.
function relay(live) {
  latest = live;
  const shown = frames.find(f => !f.hidden);
  try { shown?.contentWindow?.__live?.(live); } catch { }
}

function show() {
  const id = views[location.hash.slice(1)] ? location.hash.slice(1) : "air-brake";
  for (const f of frames) f.hidden = f.id !== id;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.view === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (latest) relay(latest);
}
addEventListener("hashchange", show);

try {
  window.engine = await workerEngine().catch(e => { console.warn("Background engine unavailable, running on the page:", e); return pageEngine(); });
  document.getElementById("loading").hidden = true;
  for (const f of frames) f.src = views[f.id];
  show();
} catch (e) {
  document.getElementById("loadTitle").textContent = "The air brake engine didn't start";
  document.getElementById("loadText").textContent = `${e.message || e}. Reload the page to try again; it needs a current browser with WebAssembly.`;
  document.querySelector(".gauge").hidden = true;
}
</script>
